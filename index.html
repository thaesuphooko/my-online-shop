<!DOCTYPE html>
<html>
<head>
    <title>My Amazon-Style Shop</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 20px; }
        .card { border: 1px solid #ddd; padding: 10px; border-radius: 8px; text-align: center; }
        img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>
    <h1 style="text-align: center;">ကျွန်ုပ်၏ Online Shop</h1>
    <div id="shop" class="grid"></div>

    <script>
        Promise.all([
            fetch('olist_products_dataset.csv').then(res => res.text()),
            fetch('olist_order_items_dataset.csv').then(res => res.text())
        ]).then(([pCsv, iCsv]) => {
            const products = Papa.parse(pCsv, { header: true }).data;
            const items = Papa.parse(iCsv, { header: true }).data;
            const shop = document.getElementById('shop');

            // ပစ္စည်း ၁၀၀ ကို အလိုအလျောက် ပြမယ်
            products.slice(0, 100).forEach((p, index) => {
                const item = items.find(i => i.product_id === p.product_id);
                const price = item ? item.price : "ဈေးမရှိ";
                
                const card = document.createElement('div');
                card.className = 'card';
                // API မှ ပုံကို အလိုအလျောက်ယူခြင်း (index ကို သုံးပြီး ပုံပြောင်းအောင်လုပ်ထားတယ်)
                card.innerHTML = `
                    <img src="https://picsum.photos/200?random=${index}" alt="Product">
                    <p>${p.product_category_name || 'ပစ္စည်း'}</p>
                    <p><b>ဈေးနှုန်း: ${price} BRL</b></p>
                `;
                shop.appendChild(card);
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>My Real Online Shop</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; }
        h3 { font-size: 16px; margin: 10px 0; }
        .price { color: #b12704; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <h1 style="text-align: center;">ကျွန်ုပ်၏ Online Shop (Real Data)</h1>
    <div id="shop" class="grid"></div>

    <script>
        Promise.all([
            fetch('olist_products_dataset.csv').then(res => res.text()),
            fetch('olist_order_items_dataset.csv').then(res => res.text())
        ]).then(([pCsv, iCsv]) => {
            const products = Papa.parse(pCsv, { header: true }).data;
            const items = Papa.parse(iCsv, { header: true }).data;
            const shop = document.getElementById('shop');

            products.slice(0, 100).forEach((p, index) => {
                const item = items.find(i => i.product_id === p.product_id);
                const price = item ? item.price : "0.00";
                
                const card = document.createElement('div');
                card.className = 'card';
                // ပုံအမှန်ပြချင်ရင် ဒီနေရာမှာ p.image_url လို့ သုံးပါ
                card.innerHTML = `
                    <img src="https://picsum.photos/200?random=${index}" alt="Product">
                    <h3>${p.product_category_name || 'ပစ္စည်းအမည်'}</h3>
                    <p class="price">${price} BRL</p>
                `;
                shop.appendChild(card);
            });
        });
    </script>
</body>
</html>
